<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>潮线前的纸船</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#082f38;color:#f7f1db;font-family:'PingFang SC','Microsoft YaHei',sans-serif}body{padding:12px}.game{max-width:1000px;margin:auto}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}.top h1{margin:0;font-size:clamp(23px,4vw,35px);letter-spacing:.05em}.top small{color:#9bd5ce;font-size:12px}.guide{min-height:46px;margin-bottom:9px;padding:8px 12px;border-left:4px solid #ff8666;background:#12434b;border-radius:0 9px 9px 0;font-size:14px;line-height:1.45}.layout{display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:12px;align-items:start}.scene{position:relative;overflow:hidden;border:3px solid #9adbd0;border-radius:15px;background:#157e87;box-shadow:0 12px 30px #001b2580}.scene svg{display:block;width:100%;height:auto}.endveil{position:absolute;inset:0;display:grid;place-items:center;background:#062e3bb9;text-align:center;padding:24px}.endveil div{max-width:320px;padding:20px;border:2px solid #f9eac9;border-radius:16px;background:#103e48}.endveil strong{display:block;font-size:26px;margin-bottom:8px}.endveil p{margin:0;line-height:1.5}.side{display:flex;flex-direction:column;gap:9px}.readout{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#15505a;border:1px solid #4b9b9d;border-radius:9px;padding:7px 9px}.metric span{display:block;font-size:11px;color:#afe0d8}.metric b{display:block;font-size:20px;line-height:1.25}.note{font-size:12px;line-height:1.45;color:#cfebe5;background:#0b3b45;border-radius:9px;padding:8px 10px}.islands{display:flex;flex-direction:column;gap:4px;font-size:12px}.islands div{display:flex;justify-content:space-between;gap:5px;padding:4px 8px;border-radius:6px;background:#12434b}.islands em{font-style:normal;color:#ffae8e}button{font:inherit;touch-action:manipulation;cursor:pointer;border:0;color:#082f38;background:#f8e9c9;border-radius:9px;min-height:42px;font-weight:800}button:active{transform:translateY(2px)}button:disabled{opacity:.48;cursor:default;transform:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions #primary{grid-column:1/-1;background:#ff8768}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pad button{min-height:41px;background:#b9e2d5}.pad button[data-dir='up']{grid-column:2}.pad button[data-dir='left']{grid-column:1;grid-row:2}.pad button[data-dir='down']{grid-column:2;grid-row:2}.pad button[data-dir='right']{grid-column:3;grid-row:2}.legend{font-size:11px;color:#a8d5cf;line-height:1.4}@media(max-width:760px){body{padding:9px}.top{align-items:center}.top small{max-width:120px;text-align:right}.layout{grid-template-columns:1fr;gap:8px}.side{gap:6px}.readout{grid-template-columns:repeat(4,1fr)}.metric{padding:5px 6px}.metric b{font-size:16px}.note{padding:6px 8px}.islands{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.islands div{display:block;text-align:center;padding:3px}.islands em{display:block}.actions{grid-template-columns:1fr 1fr 1.3fr}.actions #primary{grid-column:auto}.pad{max-width:220px;margin:auto;width:100%}.legend{display:none}}@media(max-width:420px){.guide{font-size:12px;min-height:40px}.top h1{font-size:23px}.actions button{font-size:12px;min-height:37px}.pad button{min-height:36px}.note{font-size:11px}}</style></head><body><main class='game' data-playfield-game data-playfield-state='intro'><header class='top'><h1>潮线前的纸船</h1><small>三座岛 · 一人小船 · 一场涨潮</small></header><div id='guide' class='guide' aria-live='polite'></div><div class='layout'><section id='scene' class='scene' data-playfield-scene aria-label='小岛救援地图'></section><aside class='side'><div class='readout'><div class='metric'><span>涨潮倒计时</span><b id='clock'>3:00</b></div><div class='metric'><span>船体</span><b id='hull'>■■■</b></div><div class='metric'><span>已送回码头</span><b id='saved'>0 / 3</b></div><div class='metric'><span>船上</span><b id='cargo'>空</b></div></div><div id='current' class='note' aria-live='polite'></div><div id='islands' class='islands'></div><div class='actions'><button id='start' data-playfield-action='start'>开始救援</button><button id='restart' data-playfield-action='restart'>重新开局</button><button id='primary' data-playfield-action='primary'>沿船头航行 ↑</button></div><div class='pad' aria-label='航行方向'><button data-dir='up' aria-label='向上航行'>↑</button><button data-dir='left' aria-label='向左航行'>←</button><button data-dir='down' aria-label='向下航行'>↓</button><button data-dir='right' aria-label='向右航行'>→</button></div><div class='legend'>实心礁石：此刻危险　橙色虚线礁石：下一步危险</div></aside></div></main><script>(()=>{'use strict';const root=document.querySelector('[data-playfield-game]'),scene=document.getElementById('scene'),guide=document.getElementById('guide'),clock=document.getElementById('clock'),hullEl=document.getElementById('hull'),savedEl=document.getElementById('saved'),cargoEl=document.getElementById('cargo'),currentEl=document.getElementById('current'),islandsEl=document.getElementById('islands'),startBtn=document.getElementById('start'),primaryBtn=document.getElementById('primary');const names=['灯塔屿','贝壳屿','海草屿'],islePos=[[2,2],[8,2],[8,6]],routes=[[[5,2],[5,3],[5,4],[5,5],[5,4],[5,3]],[[7,5],[8,5],[9,5],[9,4],[9,3],[8,3],[7,3],[7,4]]],dirs={up:[0,-1,'北','↑',0],right:[1,0,'东','→',90],down:[0,1,'南','↓',180],left:[-1,0,'西','←',270]},order=['right','down','left','up'];let g;const same=(p,x,y)=>p[0]===x&&p[1]===y;function fresh(phase){const sailing=phase==='playing';g={phase,boat:sailing?[2,7]:[1,7],facing:'up',hull:3,delivered:0,carrying:-1,states:[0,0,0],sea:0,beat:sailing?1:0,steps:sailing?1:0,reef:sailing?[1,1]:[0,0],deadline:sailing?performance.now()+180000:0,remaining:180,message:sailing?'解开缆绳，小船向东离港一格；礁石也前进一步。先看橙色虚线，再选航线。':'目标：逐岛接人，送回左下角码头。方向键或按钮航行；每航行三步，水流推船一格。'};clock.style.color='#f7f1db';render()}function begin(){if(g.phase==='intro')fresh('playing')}function finish(why){g.phase=why==='win'?'won':'lost';g.message=why==='win'?'三人都已回到码头，赶在涨潮前完成救援！':why==='tide'?'潮水淹没航道，仍有岛民未回到码头。':'船体三格耗尽，纸船无法继续救援。';render()}function reefAt(x,y,next){return routes.some((route,i)=>same(route[(g.reef[i]+(next?1:0))%route.length],x,y))}function damage(old,flow){g.hull--;g.boat=old;g.beat=0;if(g.hull<=0){finish('hull');return}g.message=flow?'水流把船推向礁石！船体损失一格，水流节拍重置。':'撞上当前或下一步的礁石！船体损失一格，水流节拍重置。';render()}function land(){const [x,y]=g.boat;if(x===1&&y===7&&g.carrying>=0){const id=g.carrying;g.states[id]=2;g.carrying=-1;g.delivered++;if(g.delivered===3){finish('win');return true}g.message=names[id]+'的岛民已送回码头！还需救 '+(3-g.delivered)+' 人。';return false}const id=islePos.findIndex(p=>same(p,x,y));if(id>=0&&g.states[id]===0&&g.carrying<0){g.states[id]=1;g.carrying=id;g.sea=(g.sea+1)%4;g.message='接到'+names[id]+'的岛民！水流立即转向'+dirs[order[g.sea]][2]+'；先回码头才能接下一人。'}return false}function move(dir){if(g.phase==='intro')begin();if(g.phase!=='playing')return;const d=dirs[dir],old=[...g.boat],nx=old[0]+d[0],ny=old[1]+d[1];g.facing=dir;if(nx<0||nx>10||ny<0||ny>8){g.message='已到地图边缘，换个方向航行。';render();return}const hazardous=reefAt(nx,ny,false)||reefAt(nx,ny,true);g.steps++;g.reef=g.reef.map((n,i)=>(n+1)%routes[i].length);if(hazardous){damage(old,false);return}g.boat=[nx,ny];g.beat++;g.message='航行一步。礁石沿固定路线前进，请看虚线位置。';if(land())return;if(g.beat>=3){g.beat=0;const flow=dirs[order[g.sea]],fx=g.boat[0]+flow[0],fy=g.boat[1]+flow[1];if(fx>=0&&fx<=10&&fy>=0&&fy<=8){if(reefAt(fx,fy,false)){damage(g.boat,true);return}g.boat=[fx,fy];g.message='水流向'+flow[2]+'推动小船一格。';if(land())return}else g.message='水流冲到地图边缘，本次未推动小船。'}render()}function island(id){const [x,y]=islePos[id],cx=x*60+30,cy=y*60+30,done=g.states[id]===2,aboard=g.states[id]===1;return `<g transform='translate(${cx} ${cy})'><path d='M-27 -5 Q-24 -28 -3 -27 Q22 -30 29 -7 Q34 16 12 25 Q-8 32 -25 16 Q-32 8 -27 -5Z' fill='${done?'#b6c6ad':'#f0d39c'}' stroke='#fff0cc' stroke-width='3'/><path d='M-18 -9 Q-10 -20 5 -20 Q22 -18 20 -2 Q23 12 9 16 Q-7 20 -18 9Z' fill='${done?'#7eae9d':'#69a480'}'/><path d='M-17 5 Q-10 -2 -4 6 M8 -9 Q15 -13 17 -5' fill='none' stroke='#356d62' stroke-width='3' stroke-linecap='round'/><circle r='11' fill='${done?'#547f78':aboard?'#78a9a0':'#ff8768'}' stroke='#fff0d9' stroke-width='3'/><circle r='5' fill='#e6d39e'/><text y='4' text-anchor='middle' font-size='12' font-weight='900' fill='#123b43'>${id+1}</text><rect x='-31' y='27' width='62' height='17' rx='7' fill='#073e48' opacity='.9'/><text y='39' text-anchor='middle' font-size='10' font-weight='700' fill='#f7edd4'>${done?'已救':aboard?'船上':names[id]}</text></g>`}function reef(p,ghost){const cx=p[0]*60+30,cy=p[1]*60+30;return `<g transform='translate(${cx} ${cy})' opacity='${ghost?'.72':'1'}'><path d='M-21 15 L-17 -6 L-6 -20 L5 -13 L15 -22 L22 -2 L18 18 L-4 22Z' fill='${ghost?'none':'#174e55'}' stroke='${ghost?'#ffad8e':'#ff8768'}' stroke-width='3' stroke-dasharray='${ghost?'5 4':'none'}'/><path d='M-11 4 L-2 -9 L6 2 L13 -7' fill='none' stroke='${ghost?'#ffad8e':'#73b6ab'}' stroke-width='2' stroke-dasharray='${ghost?'4 4':'none'}'/></g>`}function boat(){const cx=g.boat[0]*60+30,cy=g.boat[1]*60+30,rot=dirs[g.facing][4];return `<g transform='translate(${cx} ${cy})'><circle r='27' fill='#e9fff4' opacity='.13'/><path d='M-27 23 Q0 31 27 23' fill='none' stroke='#e5ffff' stroke-width='3' opacity='.8'/><g transform='rotate(${rot})'><path d='M0 -26 L23 11 L12 22 L-12 22 L-23 11Z' fill='#fff0d1' stroke='#274d54' stroke-width='2.5'/><path d='M0 -26 L0 13 M-22 11 Q0 17 22 11' fill='none' stroke='#bd9d7e' stroke-width='2'/><path d='M-16 13 L0 4 L16 13' fill='#e7d4b3'/></g>${g.carrying>=0?`<circle cy='9' r='8' fill='#ff8768' stroke='#fff1d7' stroke-width='3'/><circle cy='9' r='3' fill='#f5ddac'/>`:''}</g>`}function flowForecast(){const flow=dirs[order[g.sea]],x=g.boat[0]+flow[0],y=g.boat[1]+flow[1],outside=x<0||x>10||y<0||y>8;return{x,y,outside,hazard:!outside&&(reefAt(x,y,false)||reefAt(x,y,true)),flow}}function flowMarkup(){const f=flowForecast();if(f.outside)return'';const dx=f.flow[0],dy=f.flow[1],sx=g.boat[0]*60+30+dx*24,sy=g.boat[1]*60+30+dy*24,ex=f.x*60+30-dx*13,ey=f.y*60+30-dy*13,color=f.hazard?'#ff8768':'#b9e2d5';return `<g pointer-events='none' aria-hidden='true'><rect x='${f.x*60+5}' y='${f.y*60+5}' width='50' height='50' rx='12' fill='${color}' fill-opacity='.12' stroke='${color}' stroke-width='4' stroke-dasharray='7 5'/><path d='M${sx} ${sy} L${ex} ${ey}' fill='none' stroke='${color}' stroke-width='5' stroke-linecap='round' stroke-dasharray='8 5'/><path d='M${ex-dx*10+dy*8} ${ey-dy*10-dx*8} L${ex} ${ey} L${ex-dx*10-dy*8} ${ey-dy*10+dx*8}' fill='none' stroke='${color}' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/>${f.hazard?`<text x='${f.x*60+46}' y='${f.y*60+19}' text-anchor='middle' font-size='18' font-weight='900' fill='${color}'>!</text>`:''}</g>`}function mapMarkup(){let grid='';for(let x=0;x<=11;x++)grid+=`<path d='M${x*60} 0V540'/>`;for(let y=0;y<=9;y++)grid+=`<path d='M0 ${y*60}H660'/>`;let tracks='';for(const route of routes)tracks+=`<polyline points='${route.map(p=>`${p[0]*60+30},${p[1]*60+30}`).join(' ')}' fill='none' stroke='#d8ffff' stroke-opacity='.25' stroke-width='2' stroke-dasharray='5 7'/>`;let waves='';for(let y=0;y<9;y++)for(let x=0;x<11;x++)if((x*5+y*3)%4===0)waves+=`<path d='M${x*60+8} ${y*60+43} q8 -5 16 0 q8 5 16 0' fill='none' stroke='#a7e9dc' stroke-opacity='.16' stroke-width='2'/>`;const flow=dirs[order[g.sea]];let arrows='';for(const [x,y] of [[3,6],[5,7],[6,1],[9,7]])arrows+=`<g transform='translate(${x*60+30} ${y*60+30}) rotate(${flow[4]+90})' opacity='.36'><path d='M-12 0 H13 M5 -7 L13 0 L5 7' fill='none' stroke='#d7fff3' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></g>`;const next=routes.map((r,i)=>reef(r[(g.reef[i]+1)%r.length],true)).join(''),now=routes.map((r,i)=>reef(r[g.reef[i]],false)).join('');const intro=g.phase==='intro'?`<g><rect x='172' y='12' width='316' height='36' rx='12' fill='#083b46' opacity='.9'/><text x='330' y='36' text-anchor='middle' font-size='17' font-weight='800' fill='#fff0d1'>停泊中 · 开始救援后离港</text></g>`:'';const outcome=g.phase==='won'||g.phase==='lost'?`<div class='endveil'><div><strong>${g.phase==='won'?'救援成功':'救援失败'}</strong><p>${g.message}<br>点击“重新开局”再试一次。</p></div></div>`:'';return `<svg viewBox='0 0 660 540' role='img' aria-label='十一列九行的海图：左下角为码头，三座岛标有一二三，实心礁石和橙色虚线下一步礁石沿固定路线移动'><defs><linearGradient id='sea' x1='0' y1='0' x2='1' y2='1'><stop stop-color='#298f94'/><stop offset='.55' stop-color='#177983'/><stop offset='1' stop-color='#0d6472'/></linearGradient></defs><rect width='660' height='540' fill='url(#sea)'/><path d='M0 0H660V70 Q570 110 480 58 T300 76 T0 47Z' fill='#7ed1c2' opacity='.08'/><g stroke='#d8ffff' stroke-opacity='.08' stroke-width='1'>${grid}</g>${waves}${tracks}${arrows}<g><path d='M0 430 L46 430 L46 413 L111 413 L111 479 L46 479 L46 463 L0 463Z' fill='#d6bd8d' stroke='#fff2cc' stroke-width='3'/><path d='M52 421H104 M52 434H104 M52 447H104 M52 460H104' stroke='#8c765f' stroke-width='2'/><rect x='54' y='484' width='73' height='22' rx='8' fill='#093f48'/><text x='90' y='499' text-anchor='middle' font-size='13' font-weight='800' fill='#fff0d1'>救援码头</text></g>${islePos.map((_,i)=>island(i)).join('')}${next}${now}${flowMarkup()}${boat()}${intro}</svg>${outcome}`}function timeText(remaining){const total=Math.max(0,Math.ceil(remaining));return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`}function render(){root.dataset.playfieldState=[g.phase,g.steps,g.boat.join(','),g.hull,g.delivered,Math.round(g.deadline)].join(':');root.dataset.playfieldProgress=g.delivered+'/3';scene.innerHTML=mapMarkup();clock.textContent=timeText(g.remaining);hullEl.textContent='■'.repeat(g.hull)+'□'.repeat(3-g.hull);savedEl.textContent=`${g.delivered} / 3`;cargoEl.textContent=g.carrying<0?'空':names[g.carrying];const flow=dirs[order[g.sea]],forecast=flowForecast();currentEl.textContent=`已航行 ${g.steps} 步 · 水流 ${flow[2]} ${flow[3]} · 再航行 ${3-g.beat} 步会被推一格。${forecast.outside?'以当前船位预测：水流抵达地图边缘，不推动。':`以当前船位预测：推至第 ${forecast.x+1} 列、第 ${forecast.y+1} 行（${forecast.hazard?'珊瑚橙：当前或下一步有礁石':'浅绿：当前与下一步无礁石'}）。`}实心礁与橙色虚线格均危险。`;islandsEl.innerHTML=names.map((n,i)=>`<div><span>${i+1} · ${n}</span><em>${['待救','船上','已送回'][g.states[i]]}</em></div>`).join('');guide.textContent=g.phase==='intro'?'先从任一小岛接人，每次只能载一人，返回左下码头交接。三格船体或三分钟耗尽即失败；实心与虚线礁石都危险。':g.message;startBtn.disabled=g.phase!=='intro';primaryBtn.disabled=g.phase==='won'||g.phase==='lost';primaryBtn.textContent=`沿船头航行 ${dirs[g.facing][3]}`}function tick(){if(g.phase!=='playing')return;g.remaining=Math.max(0,(g.deadline-performance.now())/1000);if(g.remaining<=0){g.remaining=0;finish('tide');return}clock.textContent=timeText(g.remaining);clock.style.color=g.remaining<=30?'#ff9879':'#f7f1db'}startBtn.addEventListener('click',begin);document.getElementById('restart').addEventListener('click',()=>fresh('playing'));primaryBtn.addEventListener('click',()=>move(g.facing));document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));window.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left'}[e.key];if(!d)return;e.preventDefault();move(d)});fresh('intro');setInterval(tick,100)})();</script></body></html>

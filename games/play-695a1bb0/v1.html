 44l-9 9' fill='none' stroke-linecap='round'/></svg><span>太阳车厢</span><i class='wheel a'></i><i class='wheel b'></i></button><div class='ending' id='ending' aria-live='assertive'><b id='endTitle'></b><span id='endReason'></span></div></section><div class='below'><div class='status' id='status' aria-live='polite'>目标：连续投对 12 封，完成 3 轮；累计 3 次错投或超时则失败。</div><div class='actions'><button id='start' data-playfield-action='start'>开始发车</button><button id='restart' class='secondary' data-playfield-action='restart'>重新开始</button></div></div><footer>点击车厢或按 1／2／3。每投对 4 封进入下一轮，传送带会加速；错投会清空连续进度。</footer></main><script>(()=>{'use strict';const root=document.querySelector('[data-playfield-game]'),canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),els={progress:document.getElementById('progress'),round:document.getElementById('round'),mistakes:document.getElementById('mistakes'),next:document.getElementById('next'),clock:document.getElementById('clock'),meter:document.getElementById('meter'),sceneMessage:document.getElementById('sceneMessage'),status:document.getElementById('status'),ending:document.getElementById('ending'),endTitle:document.getElementById('endTitle'),endReason:document.getElementById('endReason'),start:document.getElementById('start')};const names={moon:'月亮',star:'星星',sun:'太阳'},kinds=['moon','star','sun'];let seed=741,queue=['moon'];for(let i=1;i<90;i++){seed=(seed*1664525+1013904223)>>>0;let candidate=kinds[seed%3];if(i>1&&candidate===queue[i-1]&&candidate===queue[i-2])candidate=kinds[(kinds.indexOf(candidate)+1)%3];queue.push(candidate)}let phase='ready',streak=0,errors=0,index=0,deadline=0,feedbackUntil=0,flight=null,notice='首封：月亮 · 点击对应车厢',status='目标：连续投对 12 封，完成 3 轮；累计 3 次错投或超时则失败。';const current=()=>queue[index%queue.length],round=()=>Math.min(3,Math.floor(streak/4)+1),duration=()=>[0,7200,5800,4400][round()];function sync(){root.dataset.playfieldState=phase;els.progress.textContent=streak+' / 12';els.round.textContent='第 '+(phase==='won'?3:round())+' / 3 轮';els.mistakes.textContent=errors+' / 3';els.mistakes.classList.toggle('danger',errors>0);els.next.textContent=phase==='won'||phase==='lost'?'—':names[queue[(index+1)%queue.length]];els.sceneMessage.textContent=notice;els.status.textContent=status;els.start.disabled=phase!=='ready';els.ending.classList.toggle('show',phase==='won'||phase==='lost');if(phase==='won'){els.endTitle.textContent='末班车，满载而归！';els.endReason.textContent='连续 12 封都送进了正确车厢，三轮分拣完成。点击「重新开始」再跑一班。'}else if(phase==='lost'){els.endTitle.textContent='这班邮车误了点';els.endReason.textContent='错投或超时累计 3 次；连续正确进度停在 '+streak+' / 12。点击「重新开始」再试。'}draw(performance.now())}function reset(){phase='ready';streak=0;errors=0;index=0;deadline=0;flight=null;notice='首封：月亮 · 点击对应车厢';status='目标：连续投对 12 封，完成 3 轮；累计 3 次错投或超时则失败。';els.clock.textContent='准备发车';els.meter.style.width='100%';sync()}function start(){if(phase!=='ready')return;phase='playing';deadline=performance.now()+duration();notice='现在投递：'+names[current()];status='邮车已发车！观察信封图形，点击对应车厢。';sync()}function deliver(choice){if(phase==='ready')start();if(phase!=='playing')return;const now=performance.now(),letter=current(),left=Math.max(0,(deadline-now)/duration()),from=690-330*(1-left),wasRound=round(),correct=choice===letter;flight={x:from,y:293,to:choice==='moon'?340:choice==='star'?555:choice==='sun'?770:350,kind:letter,good:correct,start:now};index++;if(correct){streak++;notice='投递正确！'+names[letter]+'信已上车';status='漂亮！连续正确 '+streak+' 封。'+(streak<12&&round()>wasRound?'下一轮传送带更快了。':'');if(streak>=12){phase='won';status='胜利：三轮共连续投对 12 封，所有信件安全上车。'}else{phase='feedback';feedbackUntil=now+730}}else{errors++;streak=0;notice=choice===null?'超时！信件滑过了车站':'错投！这封应去'+names[letter]+'车厢';status=(choice===null?'超时':'错投')+'，连续进度归零；累计 '+errors+' / 3 次。';if(errors>=3){phase='lost';status='失败：错投或超时累计 3 次。'}else{phase='feedback';feedbackUntil=now+850}}sync()}function icon(kind,x,y,r,ink,paper){ctx.save();ctx.translate(x,y);ctx.fillStyle=ink;ctx.strokeStyle=ink;if(kind==='moon'){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.fillStyle=paper;ctx.beginPath();ctx.arc(r*.43,-r*.35,r*.88,0,Math.PI*2);ctx.fill()}else if(kind==='sun'){ctx.lineWidth=Math.max(2,r*.18);for(let a=0;a<8;a++){let q=a*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(q)*r*1.24,Math.sin(q)*r*1.24);ctx.lineTo(Math.cos(q)*r*1.8,Math.sin(q)*r*1.8);ctx.stroke()}ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();for(let p=0;p<10;p++){let a=-Math.PI/2+p*Math.PI/5,rr=p%2?r*.48:r*1.3;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill()}ctx.restore()}function envelope(x,y,kind,scale=1,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.shadowColor='#07132499';ctx.shadowBlur=12;ctx.shadowOffsetY=8;ctx.fillStyle='#f6e8c8';ctx.beginPath();ctx.moveTo(-42,-28);ctx.lineTo(42,-28);ctx.lineTo(42,28);ctx.lineTo(-42,28);ctx.closePath();ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#c79665';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-42,-26);ctx.lineTo(0,3);ctx.lineTo(42,-26);ctx.moveTo(-42,27);ctx.lineTo(-9,0);ctx.moveTo(42,27);ctx.lineTo(9,0);ctx.stroke();ctx.fillStyle='#e9b272';ctx.beginPath();ctx.arc(0,4,17,0,Math.PI*2);ctx.fill();icon(kind,0,4,9,'#263651','#e9b272');ctx.restore()}function owl(){ctx.save();ctx.fillStyle='#17283e';ctx.fillRect(48,381,195,45);ctx.fillStyle='#f0c783';ctx.beginPath();ctx.roundRect(64,332,164,74,18);ctx.fill();ctx.fillStyle='#25354b';ctx.beginPath();ctx.roundRect(92,341,69,56,9);ctx.fill();ctx.fillStyle='#f2e1bd';ctx.beginPath();ctx.moveTo(100,352);ctx.lineTo(105,324);ctx.lineTo(119,341);ctx.quadraticCurveTo(141,333,155,345);ctx.lineTo(166,325);ctx.lineTo(172,354);ctx.quadraticCurveTo(172,390,137,394);ctx.quadraticCurveTo(103,390,100,352);ctx.fill();ctx.fillStyle='#24334a';for(const x of [123,149]){ctx.beginPath();ctx.arc(x,359,8,0,7);ctx.fill();ctx.fillStyle='#f6e1bb';ctx.beginPath();ctx.arc(x+1,357,2.5,0,7);ctx.fill();ctx.fillStyle='#24334a'}ctx.fillStyle='#e79a5f';ctx.beginPath();ctx.moveTo(135,365);ctx.lineTo(143,365);ctx.lineTo(139,372);ctx.fill();ctx.fillStyle='#b84e49';ctx.fillRect(117,381,44,7);ctx.fillRect(153,386,9,20);ctx.fillStyle='#f0c783';ctx.fillRect(59,324,13,48);ctx.fillStyle='#f3b46a';ctx.fillRect(46,321,39,10);ctx.fillStyle='#263550';ctx.beginPath();ctx.arc(87,430,19,0,7);ctx.arc(210,430,19,0,7);ctx.fill();ctx.fillStyle='#e9ad67';ctx.beginPath();ctx.arc(87,430,8,0,7);ctx.arc(210,430,8,0,7);ctx.fill();ctx.restore()}function draw(t){const w=900,h=520;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#10203a');sky.addColorStop(1,'#2b3850');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#f4dba7';ctx.beginPath();ctx.arc(734,74,29,0,7);ctx.fill();ctx.fillStyle='#15253d';ctx.beginPath();ctx.arc(749,64,28,0,7);ctx.fill();for(let i=0;i<40;i++){let x=(i*173+67)%900,y=(i*97+21)%232;ctx.globalAlpha=.4+.35*Math.sin(t/1000+i);ctx.fillStyle='#f5d9a2';ctx.fillRect(x,y,i%5===0?3:2,i%5===0?3:2)}ctx.globalAlpha=1;ctx.fillStyle='#182a42';for(let i=0;i<7;i++){let x=i*155-25,top=197+(i%3)*17;ctx.fillRect(x,top,118,175);ctx.beginPath();ctx.moveTo(x-14,top);ctx.lineTo(x+59,top-40);ctx.lineTo(x+132,top);ctx.fill()}ctx.fillStyle='#f4b76b';ctx.globalAlpha=.23;ctx.beginPath();ctx.ellipse(466,242,315,120,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#e8a866';ctx.fillRect(447,0,9,74);ctx.beginPath();ctx.arc(451,80,19,0,7);ctx.fill();let glow=ctx.createRadialGradient(451,81,4,451,81,145);glow.addColorStop(0,'#ffc67780');glow.addColorStop(1,'#ffc67700');ctx.fillStyle=glow;ctx.fillRect(300,0,300,270);ctx.fillStyle='#a8694f';ctx.fillRect(0,254,900,12);ctx.fillStyle='#253348';ctx.fillRect(164,267,700,112);ctx.fillStyle='#d8a572';ctx.fillRect(169,272,688,8);ctx.fillRect(169,371,688,8);ctx.save();ctx.beginPath();ctx.rect(173,282,679,87);ctx.clip();for(let x=0;x<21;x++){let sx=174+x*50-(t*.08%50);ctx.fillStyle=x%2?'#34455b':'#3b4d62';ctx.fillRect(sx,285,32,81);ctx.strokeStyle='#bd8e67';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,285);ctx.lineTo(sx+31,365);ctx.stroke()}ctx.restore();ctx.fillStyle='#18263b';ctx.fillRect(0,445,900,75);ctx.fillStyle='#bb865b';ctx.fillRect(0,459,900,7);ctx.fillRect(0,490,900,6);for(let x=0;x<900;x+=70){ctx.fillStyle='#604f51';ctx.fillRect(x,450,18,58)}owl();let rem=phase==='playing'?Math.max(0,(deadline-t)/duration()):1;if(phase==='ready'||phase==='playing')envelope(690-330*(1-rem),311+Math.sin(t/190)*2,current(),1,Math.sin(t/330)*.025);if(flight){let p=Math.min(1,(t-flight.start)/680);if(p<1){let x=flight.x+(flight.to-flight.x)*p,y=flight.y-105*Math.sin(Math.PI*p)+116*p;envelope(x,y,flight.kind,1-p*.38,p*.5)}else flight=null}ctx.fillStyle='#f5d5a2';ctx.font='bold 17px system-ui';ctx.fillText(phase==='ready'?'月台待发车':phase==='playing'?'夜班分拣中':phase==='feedback'?'邮差核对中':phase==='won'?'邮车满载出发':'车站暂停分拣',24,42);if(phase==='playing'){ctx.fillStyle=rem<.3?'#fa8f74':'#f4c077';ctx.fillRect(176,394,680*rem,6)}}function tick(t){if(phase==='playing'){let left=Math.max(0,deadline-t);els.clock.textContent=(left/1000).toFixed(1)+' 秒';els.meter.style.width=(left/duration()*100)+'%';els.meter.style.background=left<duration()*.3?'#fa8f74':'#f5b461';if(left<=0)deliver(null)}else if(phase==='feedback'&&t>=feedbackUntil){phase='playing';deadline=t+duration();notice='现在投递：'+names[current()];status='看清信封，再选对应车厢。当前第 '+round()+' 轮。';sync()}draw(t);requestAnimationFrame(tick)}document.querySelectorAll('.wagon').forEach(button=>button.addEventListener('click',()=>deliver(button.dataset.kind)));els.start.addEventListener('click',start);document.getElementById('restart').addEventListener('click',reset);document.addEventListener('keydown',e=>{if(e.repeat)return;const kind={'1':'moon','2':'star','3':'sun'}[e.key];if(kind)deliver(kind)});reset();requestAnimationFrame(tick)})();</script></body></html>

<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>星灯迷宫：蓝猫寻宝</title><style>:root{--bg:#091522;--panel:#112235;--line:#31536a;--gold:#ffd77a;--mint:#76e6bd;--blue:#65bfff;--text:#eef6ed;--muted:#a9bec7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 12%,#1d3d53 0,transparent 34%),radial-gradient(circle at 90% 80%,#183c42 0,transparent 30%),var(--bg);color:var(--text);font-family:Trebuchet MS,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:24px clamp(14px,3vw,38px) 36px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:21px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}.top h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,56px);line-height:1;margin:9px 0 0;letter-spacing:.03em}.top p{margin:0 0 4px;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:20px;align-items:start}.board-wrap{position:relative;padding:12px;border:1px solid #43677a;border-radius:24px;background:linear-gradient(145deg,#213b4d,#0a1a29);box-shadow:0 25px 60px #0008,inset 0 1px #ffffff22}.board-wrap:before,.board-wrap:after{content:'✦';position:absolute;color:var(--gold);font-size:18px;z-index:2}.board-wrap:before{top:-12px;left:24px}.board-wrap:after{bottom:-13px;right:24px}.maze{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);gap:2px;padding:5px;border-radius:15px;background:#07131f;overflow:hidden}.cell{position:relative;display:grid;place-items:center;border-radius:4px;min-width:0;min-height:0;transition:background .18s,filter .18s}.wall{background:linear-gradient(145deg,#395a70,#254255);box-shadow:inset 0 2px #ffffff17,inset 0 -3px #071a27}.wall.mist{background:#1b3447}.floor{background:#142c3d}.floor.visited{background:#1b3d4b}.floor.near{background:#244c58}.floor.mist{background:#102635}.floor.hint{background:#35616b;box-shadow:inset 0 0 0 2px #ffdf8570}.floor.hint:after{content:'·';position:absolute;color:var(--gold);font-size:22px;line-height:1}.star{width:67%;height:67%;background:var(--gold);clip-path:polygon(50% 0,62% 34%,98% 36%,71% 58%,80% 94%,50% 75%,20% 94%,29% 58%,2% 36%,38% 34%);filter:drop-shadow(0 0 8px #ffd46b);animation:twinkle 1.8s ease-in-out infinite alternate;z-index:1}.exit{width:72%;height:78%;border:3px solid #a8ffcf;border-bottom:0;border-radius:50% 50% 5px 5px;background:linear-gradient(#64dcaa99,#3b977b55);box-shadow:0 0 14px #4cedaa88,inset 0 0 10px #b4ffe999;opacity:.55}.exit.ready{opacity:1;animation:glow 1.4s ease-in-out infinite alternate}.exit:after{content:' ';position:absolute;bottom:0;left:10%;width:80%;height:3px;background:#a8ffcf}.cat{width:92%;height:92%;position:relative;z-index:3;filter:drop-shadow(0 3px 3px #061521)}.cat svg{width:100%;height:100%;overflow:visible}.sidebar{display:grid;gap:13px}.card{background:#112538d9;border:1px solid #3c5d6d;border-radius:18px;padding:17px;box-shadow:inset 0 1px #ffffff0e}.label{font-size:11px;font-weight:800;letter-spacing:.18em;color:#9bb7c1}.progress{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}.progress strong{font-family:Georgia,serif;font-size:39px;color:var(--gold);font-weight:500}.sparkles{font-size:23px;letter-spacing:4px;color:#536e73}.sparkles .on{color:var(--gold);text-shadow:0 0 10px #ffd77a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{padding:12px;border-radius:12px;background:#1c3648}.stats b{display:block;font-family:Georgia,serif;font-size:23px;font-weight:500;margin-top:3px}.status{min-height:48px;color:#d9ede6;line-height:1.45;font-size:14px}.actions{display:grid;gap:9px}.action{width:100%;border:1px solid #66878a;border-radius:12px;background:#244757;color:#f5fff6;padding:12px;font-weight:800;transition:transform .12s,background .12s}.action:hover{background:#326071;transform:translateY(-2px)}.action.gold{background:var(--gold);border-color:var(--gold);color:#173345}.action.gold:hover{background:#ffe4a0}.help{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.keys{display:flex;gap:5px;margin-top:9px}.keys span{border:1px solid #5c7784;border-bottom-width:3px;border-radius:5px;padding:2px 6px;color:#e9f6ef;font-size:11px}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:5px;touch-action:manipulation}.pad button{border:1px solid #688a95;border-bottom:3px solid #39586b;border-radius:12px;background:#2b5364;color:white;font-size:22px}.pad button:active{transform:translateY(2px);border-bottom-width:1px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.overlay{position:absolute;inset:12px;display:grid;place-items:center;z-index:5;border-radius:15px;background:#071724c9;backdrop-filter:blur(5px);padding:18px}.overlay.hidden{display:none}.modal{max-width:350px;width:100%;text-align:center;padding:30px 23px;background:linear-gradient(145deg,#244a5b,#102b3c);border:1px solid #86a5a3;border-radius:22px;box-shadow:0 20px 50px #0009}.modal .mark{font-size:43px;color:var(--gold);line-height:1}.modal h2{font-family:Georgia,serif;font-size:clamp(25px,5vw,35px);margin:12px 0}.modal p{color:#d3e6e5;line-height:1.65;font-size:14px;margin:0 0 20px}.modal button{border:0;border-radius:12px;padding:13px 27px;background:var(--gold);color:#193649;font-weight:900;box-shadow:0 5px 0 #b88643}.modal button:active{transform:translateY(4px);box-shadow:0 1px 0 #b88643}@keyframes twinkle{to{transform:scale(.79) rotate(14deg);opacity:.72}}@keyframes glow{to{box-shadow:0 0 25px #6bffb7,inset 0 0 18px #b4ffe9}}@media(max-width:760px){.top{display:block}.top p{margin-top:10px}.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.sidebar .wide{grid-column:1/-1}.board-wrap{max-width:610px;margin:auto;width:100%}}@media(max-width:440px){.shell{padding:17px 10px 25px}.board-wrap{padding:7px;border-radius:15px}.maze{gap:1px;padding:3px}.overlay{inset:7px}.sidebar{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main class='shell'><header class='top'><div><div class='eyebrow'>✦ 星灯探险手记 / 第 01 章</div><h1>蓝猫寻宝</h1></div><p>穿过夜色，把星光带回出口。</p></header><div class='layout'><section class='board-wrap' aria-label='迷宫游戏区'><div id='maze' class='maze' role='img' aria-label='十三乘十三的迷宫'></div><div id='overlay' class='overlay'><div class='modal'><div class='mark'>✧</div><h2 id='overlayTitle'>今晚，星星迷路了</h2><p id='overlayText'>用方向键、WASD 或下方按钮移动蓝色小猫。找到三颗星星，再走进绿色出口。按空格可使用喵声寻路，但会降低得分。</p><button id='start'>开始寻宝</button></div></div></section><aside class='sidebar'><div class='card'><div class='label'>星光收集</div><div class='progress'><strong id='count'>0 / 3</strong><div id='sparkles' class='sparkles'>✦✦✦</div></div></div><div class='card'><div class='label'>探险记录</div><div class='stats'><div><span class='label'>步数</span><b id='steps'>0</b></div><div><span class='label'>得分</span><b id='score'>1000</b></div></div></div><div class='card wide'><div class='label'>小猫的消息</div><p id='status' class='status' aria-live='polite'>收齐三颗星，绿色出口才会亮起。</p><div class='actions'><button id='hint' class='action'>♪ 喵声寻路 · 空格</button><button id='restart' class='action gold'>↻ 重新开始</button></div></div><div class='card wide'><div class='label'>移动方式</div><p class='help'>方向键 / WASD 移动。发出喵声会短暂照亮通往最近星星的路线；集齐后指向出口。每次喵声扣 80 分。</p><div class='keys'><span>↑</span><span>←</span><span>↓</span><span>→</span><span>空格</span></div><div class='pad' aria-label='触屏方向控制'><button class='up' data-dir='up' aria-label='向上'>↑</button><button class='left' data-dir='left' aria-label='向左'>←</button><button class='down' data-dir='down' aria-label='向下'>↓</button><button class='right' data-dir='right' aria-label='向右'>→</button></div></div></aside></div></main><script>(()=>{const N=13,mazeEl=document.getElementById('maze'),overlay=document.getElementById('overlay'),countEl=document.getElementById('count'),sparklesEl=document.getElementById('sparkles'),stepsEl=document.getElementById('steps'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');let grid,player,exit,stars,collected,visited,steps,pings,active=false,hintPath=new Set(),hintTimer=0,lastMove=0;const cat=`<div class='cat'><svg viewBox='0 0 48 48' aria-hidden='true'><path d='M7 24 9 5l12 8a19 19 0 0 1 6 0L39 5l2 19c3 13-5 21-17 21S4 37 7 24Z' fill='#59b9f4' stroke='#daf6ff' stroke-width='2.4' stroke-linejoin='round'/><path d='m11 9 8 7-9 3Zm26 0-8 7 9 3Z' fill='#ffadc1'/><ellipse cx='16' cy='27' rx='2.1' ry='3.1' fill='#173b54'/><ellipse cx='32' cy='27' rx='2.1' ry='3.1' fill='#173b54'/><path d='m21 33 3 2 3-2-3-1Z' fill='#fa9fac'/><path d='M24 35v2m0 0q-4 4-7 0m7 0q4 4 7 0M13 34 4 32m9 5-9 1m31-4 9-2m-9 5 9 1' fill='none' stroke='#dff7ff' stroke-width='1.5' stroke-linecap='round'/></svg></div>`;const dirs=[[0,-1],[1,0],[0,1],[-1,0]];function index(x,y){return y*N+x}function xy(i){return[i%N,Math.floor(i/N)]}function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function makeMaze(){grid=Array.from({length:N},()=>Array(N).fill(1));const stack=[[1,1]];grid[1][1]=0;while(stack.length){const [x,y]=stack[stack.length-1],choices=shuffle([[0,-2],[2,0],[0,2],[-2,0]]).filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<N-1&&ny<N-1&&grid[ny][nx]===1});if(!choices.length){stack.pop();continue}const[dx,dy]=choices[0];grid[y+dy/2][x+dx/2]=0;grid[y+dy][x+dx]=0;stack.push([x+dx,y+dy])}for(let t=0;t<13;t++){const x=1+rand(N-2),y=1+rand(N-2);if(grid[y][x]&&(grid[y][x-1]===0&&grid[y][x+1]===0||grid[y-1][x]===0&&grid[y+1][x]===0))grid[y][x]=0}player=index(1,1);const fromStart=bfs(player);const floors=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(grid[y][x]===0)floors.push(index(x,y));exit=floors.reduce((best,i)=>fromStart.dist[i]>fromStart.dist[best]?i:best,player);stars=[];for(let k=0;k<3;k++){let best=-1,bestValue=-1;for(const i of floors){if(i===player||i===exit||stars.includes(i))continue;let value=Math.min(fromStart.dist[i],...stars.map(s=>bfs(s).dist[i]));if(value>bestValue){bestValue=value;best=i}}stars.push(best)}}function bfs(start){const dist=Array(N*N).fill(Infinity),prev=Array(N*N).fill(-1),queue=[start];dist[start]=0;for(let head=0;head<queue.length;head++){const i=queue[head],x=i%N,y=Math.floor(i/N);for(const[dx,dy]of dirs){const nx=x+dx,ny=y+dy,ni=index(nx,ny);if(nx<0||ny<0||nx>=N||ny>=N||grid[ny][nx]||dist[ni]!==Infinity)continue;dist[ni]=dist[i]+1;prev[ni]=i;queue.push(ni)}}return{dist,prev}}function score(){return Math.max(0,1000-steps*7-pings*80)}function message(t){statusEl.textContent=t}function render(){const near=bfs(player).dist,frag=document.createDocumentFragment();for(let i=0;i<N*N;i++){const[x,y]=xy(i),wall=grid[y][x],cell=document.createElement('div');cell.className='cell '+(wall?'wall':'floor');if(!wall){if(visited.has(i))cell.classList.add('visited');if(near[i]<=2)cell.classList.add('near');else if(!visited.has(i))cell.classList.add('mist');if(hintPath.has(i))cell.classList.add('hint');if(i===exit){const gate=document.createElement('div');gate.className='exit'+(collected.size===3?' ready':'');cell.appendChild(gate)}if(stars.includes(i)&&!collected.has(i)){const star=document.createElement('div');star.className='star';cell.appendChild(star)}if(i===player)cell.insertAdjacentHTML('beforeend',cat)}else if(near[i]>2)cell.classList.add('mist');frag.appendChild(cell)}mazeEl.replaceChildren(frag);countEl.textContent=collected.size+' / 3';sparklesEl.innerHTML=[0,1,2].map(i=>'<span class='+(i<collected.size?'on':'off')+'>✦</span>').join('');stepsEl.textContent=steps;scoreEl.textContent=score()}function showOverlay(title,text,button){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayText').textContent=text;document.getElementById('start').textContent=button;overlay.classList.remove('hidden')}function reset(startNow){clearTimeout(hintTimer);hintPath.clear();makeMaze();collected=new Set();visited=new Set([player]);steps=0;pings=0;active=!!startNow;message('收齐三颗星，绿色出口才会亮起。');render();if(startNow)overlay.classList.add('hidden');else showOverlay('今晚，星星迷路了','用方向键、WASD 或下方按钮移动蓝色小猫。找到三颗星星，再走进绿色出口。按空格可使用喵声寻路，但会降低得分。','开始寻宝')}function move(dx,dy){if(!active)return;const[x,y]=xy(player),nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N||grid[ny][nx])return;player=index(nx,ny);visited.add(player);steps++;if(stars.includes(player)&&!collected.has(player)){collected.add(player);message(collected.size===3?'三颗星齐了！快去绿色出口。':'找到一颗星！还差 '+(3-collected.size)+' 颗。')}else if(player===exit&&collected.size<3)message('出口还未点亮，再找 '+(3-collected.size)+' 颗星。');else message('夜色里还有路，继续往前走。');render();if(player===exit&&collected.size===3){active=false;message('寻宝成功！最终得分 '+score()+' 分。');showOverlay('星光全都回家了！','你走了 '+steps+' 步，使用 '+pings+' 次喵声，最终得到 '+score()+' 分。','再玩一局')}}function hint(){if(!active)return;const result=bfs(player),targets=collected.size===3?[exit]:stars.filter(s=>!collected.has(s));let target=targets.reduce((a,b)=>result.dist[a]<result.dist[b]?a:b);hintPath.clear();for(let i=target;i!==player&&i!==-1;i=result.prev[i])hintPath.add(i);pings++;message('喵～金色微光指向'+(collected.size===3?'出口。':'最近的星星。'));render();clearTimeout(hintTimer);hintTimer=setTimeout(()=>{hintPath.clear();render()},2600)}const keyDirs={ArrowUp:[0,-1],ArrowRight:[1,0],ArrowDown:[0,1],ArrowLeft:[-1,0],w:[0,-1],d:[1,0],s:[0,1],a:[-1,0]};document.addEventListener('keydown',e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;if(keyDirs[key]){e.preventDefault();if(Date.now()-lastMove<65)return;lastMove=Date.now();move(...keyDirs[key])}else if(key===' '){e.preventDefault();if(!e.repeat)hint()}});document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>{const map={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};move(...map[button.dataset.dir])}));document.getElementById('hint').addEventListener('click',hint);document.getElementById('restart').addEventListener('click',()=>reset(true));document.getElementById('start').addEventListener('click',()=>reset(true));reset(false)})();</script></body></html>

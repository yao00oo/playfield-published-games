<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>暮光钟塔：停摆跃迁</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1024;color:#f7f0ff;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;background:radial-gradient(circle at 50% 10%,#38305b,#101225 68%)}.top{width:min(1180px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}.brand{font-weight:900;letter-spacing:.08em;color:#ffe0a1;font-size:clamp(15px,2.3vw,22px)}.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid #ffffff29;background:#ffffff12;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}.stage{position:relative;width:min(1180px,100%);height:min(68svh,660px);min-height:280px;overflow:hidden;border-radius:22px;border:2px solid #bfa4ff69;box-shadow:0 24px 80px #0009,0 0 40px #a977ff26;background:#15172d}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0c0d23ad;backdrop-filter:blur(7px);z-index:5;padding:18px}.overlay.hidden{display:none}.panel{width:min(470px,100%);padding:clamp(22px,5vw,38px);text-align:center;background:linear-gradient(145deg,#2b2850ef,#171a35f5);border:1px solid #e9c8927d;border-radius:25px;box-shadow:0 20px 70px #0008}.eyebrow{font-size:12px;letter-spacing:.25em;color:#ffc989;font-weight:800}.panel h1{margin:10px 0;font-size:clamp(28px,6vw,48px);line-height:1.15}.panel p{color:#dedaf5;line-height:1.7;margin:12px 0 22px;font-size:15px}.panel strong{color:#ffe5a4}.mainbtn{border:0;border-radius:15px;padding:13px 30px;background:linear-gradient(135deg,#ffd88d,#ff9c8d);color:#30213b;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 8px 25px #ffad8660}.mainbtn:active{transform:translateY(2px)}.controls{width:min(1180px,100%);display:flex;justify-content:space-between;align-items:center;gap:9px}.hint{color:#bbb7d2;font-size:12px;line-height:1.4}.touch{display:flex;gap:9px}.touch button{touch-action:none;user-select:none;-webkit-user-select:none;width:58px;height:54px;border-radius:15px;border:1px solid #d7c9ff69;background:#ffffff18;color:#fff;font-size:22px;font-weight:900;cursor:pointer}.touch button[data-a='freeze']{width:74px;font-size:13px;color:#aaf5ff}.touch button:active,.touch button.pressed{background:#ffd89066;transform:scale(.96)}@media(max-width:700px){body{gap:7px;padding:7px}.stage{height:65svh;min-height:260px}.top{align-items:flex-start}.brand{font-size:15px}.chip{padding:5px 8px;font-size:11px}.hint{display:none}.controls{justify-content:center}.touch{width:100%;justify-content:space-between}.touch button{width:20%;height:60px}.touch button[data-a='freeze']{width:25%}}</style></head><body><div class='top'><div class='brand'>✦ 暮光钟塔</div><div class='hud'><span class='chip' id='lives'>♥ ♥ ♥</span><span class='chip' id='score'>星屑 0 / 10</span><span class='chip' id='power'>停摆：就绪</span></div></div><div class='stage' id='stage'><canvas id='game' aria-label='横版平台跳跃游戏'></canvas><div class='overlay' id='overlay'><div class='panel'><div class='eyebrow'>CLOCKWORK JOURNEY</div><h1 id='headline'>停摆跃迁</h1><p id='message'>越过移动钟盘与尖刺，抵达最右侧的<strong>金色旗帜</strong>。收集星屑可得分；途中有一处重生点。你有<strong>三条生命</strong>。<br>方向键或 A/D 移动，空格或 ↑ 跳跃，X 让移动平台<strong>停摆 2 秒</strong>。停摆后需要冷却。</p><button class='mainbtn' id='start'>开始冒险</button></div></div></div><div class='controls'><div class='hint'>← → / A D 移动　·　空格 / ↑ 跳跃　·　X 停摆　·　抵达旗帜获胜</div><div class='touch'><button data-a='left' aria-label='向左'>◀</button><button data-a='right' aria-label='向右'>▶</button><button data-a='jump' aria-label='跳跃'>↑</button><button data-a='freeze' aria-label='冻结平台'>❄ 停摆</button></div></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),message=document.getElementById('message'),start=document.getElementById('start'),livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),powerEl=document.getElementById('power');const H=540,world=2300,grounds=[[0,300],[450,700],[850,1100],[1250,1500],[1650,1880],[2030,2300]],spikes=[565,945,1395,1770,2120].map(x=>({x,y:450,w:53,h:25})),seedPlatforms=[{x:348,y:374,w:100,ax:32,ay:16,phase:0},{x:760,y:365,w:96,ax:47,ay:19,phase:1.4},{x:1155,y:374,w:94,ax:30,ay:17,phase:2.2},{x:1545,y:364,w:106,ax:42,ay:19,phase:3.1},{x:1924,y:374,w:98,ax:40,ay:15,phase:4.2}],seedStars=[[345,325],[515,390],[775,310],[995,390],[1165,322],[1335,390],[1560,315],[1710,390],[1935,320],[2080,390]],keys={},touch={left:false,right:false};let W=960,dpr=1,state='menu',p,platforms,stars,lives,score,checkpoint,freeze,cool,t=0,camera=0,jumpBuffer=0,acc=0,last=0;function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));W=Math.max(420,Math.min(1100,H*r.width/r.height))}addEventListener('resize',resize);resize();function reset(){platforms=seedPlatforms.map((a,i)=>({...a,id:i,baseX:a.x,baseY:a.y,prevX:a.x,prevY:a.y}));stars=seedStars.map(([x,y])=>({x,y,taken:false}));p={x:52,y:412,w:27,h:38,vx:0,vy:0,grounded:false,coyote:0,support:null,inv:0};lives=3;score=0;checkpoint=52;freeze=0;cool=0;t=0;camera=0;jumpBuffer=0;updateHud()}function updateHud(){livesEl.textContent='♥ '.repeat(lives).trim()||'♡';scoreEl.textContent='星屑 '+score+' / '+stars.length;powerEl.textContent=freeze>0?'停摆 '+freeze.toFixed(1)+' 秒':cool>0?'冷却 '+cool.toFixed(1)+' 秒':'停摆：就绪'}function show(title,body,label){headline.textContent=title;message.innerHTML=body;start.textContent=label;overlay.classList.remove('hidden')}function begin(){reset();state='playing';overlay.classList.add('hidden')}start.addEventListener('click',begin);function stopTime(){if(state==='playing'&&cool<=0){freeze=2.1;cool=6.2;updateHud()}}function die(){if(state!=='playing'||p.inv>0)return;lives--;if(lives<=0){state='lost';updateHud();show('钟声止息','你收集了 <strong>'+score+' 枚星屑</strong>。再试一次，利用停摆把钟盘留在最合适的位置。','重新挑战');return}p.x=checkpoint;p.y=412;p.vx=0;p.vy=0;p.support=null;p.inv=1.5;freeze=0;updateHud()}function win(){state='won';let total=score*100+lives*250;show('抵达黎明','你成功抵达旗帜！<br>星屑 '+score+' × 100 ＋ 剩余生命 '+lives+' × 250 ＝ <strong>'+total+' 分</strong>','再玩一次')}function approach(a,b,n){return a<b?Math.min(a+n,b):Math.max(a-n,b)}function update(dt){if(state!=='playing')return;t+=dt;freeze=Math.max(0,freeze-dt);cool=Math.max(0,cool-dt);p.inv=Math.max(0,p.inv-dt);for(const m of platforms){m.prevX=m.x;m.prevY=m.y;if(freeze<=0){m.x=m.baseX+Math.sin(t*1.8+m.phase)*m.ax;m.y=m.baseY+Math.sin(t*2.2+m.phase)*m.ay}}if(p.support!==null){const m=platforms[p.support];p.x+=m.x-m.prevX;p.y+=m.y-m.prevY}const dir=(keys.ArrowRight||keys.KeyD||touch.right?1:0)-(keys.ArrowLeft||keys.KeyA||touch.left?1:0);p.vx=approach(p.vx,dir*305,(dir?2250:2700)*dt);p.coyote=p.grounded?.11:Math.max(0,p.coyote-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);if(jumpBuffer>0&&p.coyote>0){p.vy=-715;p.grounded=false;p.support=null;p.coyote=0;jumpBuffer=0}const oldBottom=p.y+p.h;p.vy=Math.min(920,p.vy+1850*dt);p.x=Math.max(0,Math.min(world-p.w,p.x+p.vx*dt));p.y+=p.vy*dt;p.grounded=false;p.support=null;for(const [a,b] of grounds){if(p.vy>=0&&p.x+p.w>a+3&&p.x<b-3&&oldBottom<=454&&p.y+p.h>=450){p.y=450-p.h;p.vy=0;p.grounded=true;break}}if(!p.grounded)for(const m of platforms){if(p.vy>=0&&p.x+p.w>m.x+5&&p.x<m.x+m.w-5&&oldBottom<=m.y+12&&p.y+p.h>=m.y){p.y=m.y-p.h;p.vy=0;p.grounded=true;p.support=m.id;break}}for(const s of spikes){if(p.x+p.w>s.x+6&&p.x<s.x+s.w-6&&p.y+p.h>s.y-s.h+7&&p.y<s.y+3){die();break}}if(p.y>610)die();for(const s of stars){if(!s.taken&&Math.abs(p.x+p.w/2-s.x)<24&&Math.abs(p.y+p.h/2-s.y)<26){s.taken=true;score++}}if(checkpoint===52&&p.x>1300){checkpoint=1290;p.inv=Math.max(p.inv,.6)}if(p.x+p.w>2205&&p.y+p.h>390)win();camera=Math.max(0,Math.min(world-W,p.x-W*.34));updateHud()}function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}function draw(){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#171938');sky.addColorStop(.55,'#46375c');sky.addColorStop(1,'#b06672');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f9dfba';ctx.shadowColor='#ffe0b8';ctx.shadowBlur=35;ctx.beginPath();ctx.arc(W*.79,112,32,0,7);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<80;i++){let sx=((i*173.7-camera*.12)%(W+80)+(W+80))%(W+80),sy=25+(i*97)%260;ctx.globalAlpha=.25+(i%5)*.12;ctx.fillStyle='#fff4d4';ctx.fillRect(sx,sy,i%7===0?3:2,i%7===0?3:2)}ctx.globalAlpha=1;ctx.fillStyle='#242946';for(let i=0;i<24;i++){let x=i*95-camera*.23;ctx.fillRect(x,315-(i*29%85),63,240);ctx.fillStyle='#46506c';ctx.fillRect(x+16,333-(i*29%85),4,7);ctx.fillStyle='#242946'}ctx.fillStyle='#3e354e';ctx.beginPath();ctx.moveTo(0,430);for(let x=0;x<=W+30;x+=30)ctx.lineTo(x,389+Math.sin((x+camera*.4)/110)*27);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.save();ctx.translate(-camera,0);for(const [a,b] of grounds){const gr=ctx.createLinearGradient(0,450,0,540);gr.addColorStop(0,'#52435e');gr.addColorStop(1,'#26253f');ctx.fillStyle=gr;ctx.fillRect(a,450,b-a,120);ctx.fillStyle='#dcad86';ctx.fillRect(a,449,b-a,7);ctx.fillStyle='#8b6680';for(let x=a+16;x<b;x+=43){ctx.fillRect(x,472,2,70);ctx.fillRect(x+18,494,13,2)}}for(const m of platforms){ctx.strokeStyle='#d3b89345';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.baseX+m.w/2,m.baseY+6);ctx.lineTo(m.x+m.w/2,m.y+10);ctx.stroke();ctx.shadowColor=freeze>0?'#8ff8ff':'#ffcb89';ctx.shadowBlur=16;ctx.fillStyle=freeze>0?'#73dfe9':'#d8a875';rr(m.x,m.y,m.w,15,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#64506a';ctx.fillRect(m.x+7,m.y+15,m.w-14,8);for(let j=12;j<m.w;j+=18){ctx.fillStyle='#fff1ca';ctx.fillRect(m.x+j,m.y+5,4,3)}}for(const s of spikes){for(let i=0;i<3;i++){ctx.fillStyle='#e86878';ctx.beginPath();ctx.moveTo(s.x+i*17,s.y);ctx.lineTo(s.x+i*17+9,s.y-s.h);ctx.lineTo(s.x+i*17+18,s.y);ctx.fill();ctx.strokeStyle='#ffd2b5';ctx.lineWidth=2;ctx.stroke()}}for(const s of stars)if(!s.taken){let bob=Math.sin(t*3+s.x)*4;ctx.save();ctx.translate(s.x,s.y+bob);ctx.rotate(Math.PI/4);ctx.shadowColor='#ffe89d';ctx.shadowBlur=18;ctx.fillStyle='#ffe8a2';ctx.fillRect(-9,-9,18,18);ctx.shadowBlur=0;ctx.fillStyle='#fff9dd';ctx.fillRect(-4,-4,8,8);ctx.restore()}ctx.fillStyle=checkpoint===52?'#807e9d':'#9affd3';ctx.fillRect(1290,382,7,68);ctx.beginPath();ctx.arc(1293,378,11,0,7);ctx.fill();ctx.fillStyle='#ffdb89';ctx.fillRect(2200,324,7,126);ctx.beginPath();ctx.moveTo(2207,326);ctx.lineTo(2260,343);ctx.lineTo(2207,365);ctx.closePath();ctx.fill();ctx.fillStyle='#fdf5d5';ctx.font='bold 15px system-ui';ctx.fillText('终点',2188,310);if(!(p.inv>0&&Math.floor(t*12)%2===0)){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#171a36';ctx.fillRect(2,34,9,5);ctx.fillRect(18,34,9,5);ctx.fillStyle='#f4d29e';rr(1,0,25,35,8);ctx.fill();ctx.fillStyle='#6e668f';rr(4,13,19,23,5);ctx.fill();ctx.fillStyle='#161b32';ctx.fillRect(18,8,3,4);ctx.fillStyle='#ff928b';ctx.beginPath();ctx.moveTo(4,16);ctx.lineTo(-9-p.vx*.015,22);ctx.lineTo(5,22);ctx.fill();ctx.restore()}ctx.restore();if(freeze>0){ctx.fillStyle='#80eaff12';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#a9faff55';ctx.lineWidth=3;ctx.strokeRect(5,5,W-10,H-10)}const progress=Math.max(0,Math.min(1,p.x/2200));ctx.fillStyle='#ffffff35';rr(20,H-25,W-40,6,3);ctx.fill();ctx.fillStyle='#ffd995';rr(20,H-25,(W-40)*progress,6,3);ctx.fill();ctx.fillStyle='#f7e8cb';ctx.font='12px system-ui';ctx.fillText('旗帜 →',W-75,H-34)}function frame(ms){if(!last)last=ms;acc=Math.min(.05,acc+(ms-last)/1000);last=ms;while(acc>=1/120){update(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyX','Enter'].includes(e.code))e.preventDefault();if(!keys[e.code]&&(e.code==='Space'||e.code==='ArrowUp'))jumpBuffer=.16;if(!keys[e.code]&&e.code==='KeyX')stopTime();keys[e.code]=true;if(e.code==='Enter'&&state!=='playing')begin()});document.addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touch.left=false;touch.right=false;document.querySelectorAll('.touch button').forEach(b=>b.classList.remove('pressed'))});document.querySelectorAll('.touch button').forEach(b=>{const a=b.dataset.a;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('pressed');if(a==='jump')jumpBuffer=.16;else if(a==='freeze')stopTime();else touch[a]=true});const release=()=>{b.classList.remove('pressed');if(a==='left'||a==='right')touch[a]=false};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)});reset();requestAnimationFrame(frame)})();</script></body></html>

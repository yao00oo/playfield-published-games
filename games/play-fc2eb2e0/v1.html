<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>潮汐海图：三港引光</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061824;color:#f3e7ce;font-family:'Songti SC','Noto Serif CJK SC',Georgia,serif}body{display:flex;justify-content:center}.game{width:min(100%,760px);padding:14px 12px 24px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 10px}.eyebrow{color:#c28c5c;font-size:11px;letter-spacing:.25em}.head h1{margin:3px 0 0;font-weight:600;font-size:clamp(23px,5vw,34px);letter-spacing:.08em}.seal{border:1px solid #9a704e;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;color:#d6a675;font-size:10px;letter-spacing:.12em;transform:rotate(-12deg);flex:none}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.stat{border-top:1px solid #805f48;border-bottom:1px solid #294452;padding:7px 4px;text-align:center;min-width:0}.stat small{display:block;color:#afc6c7;font-size:10px;letter-spacing:.12em}.stat strong{display:block;font-size:clamp(16px,4vw,21px);font-weight:500;white-space:nowrap}.stage{position:relative;width:100%;aspect-ratio:1;background:#092330;border:1px solid #866747;overflow:hidden;box-shadow:0 12px 38px #0007}.stage:before{content:'';position:absolute;inset:7px;border:1px solid #c094614d;pointer-events:none;z-index:2}.stage canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;z-index:3}.overlay[hidden]{display:none}.panel{max-width:390px;background:#071d2be8;border:1px solid #c99a65;padding:19px 20px;text-align:center;box-shadow:0 12px 32px #0009;pointer-events:auto}.panel .mark{font-size:12px;color:#d0a071;letter-spacing:.27em}.panel h2{font-size:24px;font-weight:500;margin:8px 0}.panel p{font-size:14px;line-height:1.65;margin:7px 0;color:#e4dbc9}.panel .hint{font-size:12px;color:#bad0cc}.feedback{min-height:42px;padding:10px 3px 4px;color:#dec397;font-size:13px;line-height:1.35}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}button{appearance:none;border:1px solid #b78658;background:#15313d;color:#f3e7ce;font:600 13px 'Songti SC',serif;min-height:46px;padding:7px 4px;cursor:pointer;touch-action:manipulation}button:hover:not(:disabled),button:focus-visible{background:#ad7950;color:#071824;outline:2px solid #f3e7ce;outline-offset:1px}button:disabled{opacity:.45;cursor:default}.primary{background:#b98759;color:#071a25}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:#86a7aa;font-size:11px;letter-spacing:.06em}@media(max-width:500px){.game{padding:10px 9px 18px}.seal{width:43px;height:43px;font-size:8px}.controls{grid-template-columns:repeat(2,1fr)}.panel{padding:15px;max-width:290px}.panel h2{font-size:20px}.panel p{font-size:12px}.feedback{font-size:12px}}</style></head><body><main class='game' data-playfield-game data-playfield-state='intro'><header class='head'><div><div class='eyebrow'>NORTH SEA LIGHT CHART · 03</div><h1>潮汐海图</h1></div><div class='seal'>引光<br>三港</div></header><section class='hud' aria-label='航行状态'><div class='stat'><small>海域</small><strong id='levelText'>01 / 03</strong></div><div class='stat'><small>剩余时间</small><strong id='timeText'>90 秒</strong></div><div class='stat'><small>能量 · 港口</small><strong id='scoreText'>8 · 0/3</strong></div></section><div class='stage'><canvas width='1500' height='1500' data-playfield-scene aria-label='铜镜光路海图'></canvas><div class='overlay' id='overlay'></div></div><div class='feedback' id='feedback' aria-live='polite'>光束会在中央分光浮标分成三路。</div><div class='controls'><button id='start' data-playfield-action='start'>开始航行</button><button id='primary' class='primary' data-playfield-action='primary'>旋转选中铜镜</button><button id='next'>下一关</button><button id='restart' data-playfield-action='restart'>重开航程</button></div><div class='foot'><span>点击铜镜旋转 · 空格旋转 · ← → 选镜</span><span>8 点能量 / 90 秒</span></div></main><script>(()=>{'use strict';const root=document.querySelector('[data-playfield-game]'),canvas=document.querySelector('[data-playfield-scene]'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),feedback=document.getElementById('feedback'),levelText=document.getElementById('levelText'),timeText=document.getElementById('timeText'),scoreText=document.getElementById('scoreText'),startBtn=document.getElementById('start'),primaryBtn=document.getElementById('primary'),nextBtn=document.getElementById('next'),restartBtn=document.getElementById('restart');const levels=[{name:'初航 · 三岬',ports:[{x:5,y:0,n:'北岬'},{x:6,y:3,n:'东湾'},{x:5,y:6,n:'南角'}],reefs:[],mirrors:[[2,1,1,0],[5,1,0,0],[2,5,0,1],[5,5,1,1]]},{name:'浅滩 · 回流',ports:[{x:6,y:2,n:'北湾'},{x:6,y:5,n:'东港'},{x:2,y:6,n:'南汐'}],reefs:[[4,3],[5,3],[4,4],[5,4]],mirrors:[[2,1,1,0],[4,1,1,1],[4,2,0,1],[3,3,0,1],[3,5,1,1]]},{name:'暗礁 · 终航',ports:[{x:5,y:0,n:'北灯'},{x:6,y:4,n:'远港'},{x:2,y:6,n:'南灯'}],reefs:[[4,3],[5,3],[6,3],[5,5],[6,5]],mirrors:[[2,1,1,0],[3,1,1,1],[3,2,0,1],[5,2,0,0],[3,3,0,1],[3,5,1,1],[4,5,1,0],[4,4,0,0]]}];const D=[[1,0],[0,1],[-1,0],[0,-1]],C=n=>170+n*110;let state='intro',level=0,board=makeBoard(0),selected=0,energy=8,turns=0,run=0,remaining=90,startedAt=0,raf=0,lastPaint=0,note='光束会在中央分光浮标分成三路。',result={segments:[],lit:new Set()};function makeBoard(i){const src=levels[i];return{ports:src.ports,reefs:src.reefs.map(p=>p.join(',')),mirrors:src.mirrors.map(p=>({x:p[0],y:p[1],dir:p[2],goal:p[3]}))}}function key(x,y){return x+','+y}function trace(){const segments=[],lit=new Set(),seen=new Set(),queue=[{x:0,y:3,d:0}];let safety=0;while(queue.length&&safety++<50){let{x,y,d}=queue.shift();for(let step=0;step<70;step++){const visit=x+','+y+','+d;if(seen.has(visit))break;seen.add(visit);if(x===2&&y===3&&d===0){queue.push({x,y,d:3},{x,y,d:1})}const m=board.mirrors.find(v=>v.x===x&&v.y===y);if(m)d=(m.dir===0?[3,2,1,0]:[1,0,3,2])[d];const nx=x+D[d][0],ny=y+D[d][1];segments.push({x,y,nx,ny,reef:board.reefs.includes(key(nx,ny))});if(nx<0||nx>6||ny<0||ny>6||board.reefs.includes(key(nx,ny)))break;const port=board.ports.find(p=>p.x===nx&&p.y===ny);if(port){lit.add(key(nx,ny));break}x=nx;y=ny}}return{segments,lit}}function setOverlay(){if(state==='intro'){overlay.hidden=false;overlay.innerHTML='<div class=panel><div class=mark>航海任务 · 01</div><h2>把灯送到三港</h2><p>旋转铜镜，让灯塔的光穿过分光浮标，点亮三座港口。每关三港全亮，才能驶向下一片海域。</p><p class=hint>90 秒闯过三关。误转已对准的镜子会损失 1 点能量；耗尽 8 点即失败。点击下方「开始航行」。</p></div>'}else if(state==='levelclear'){overlay.hidden=false;overlay.innerHTML='<div class=panel><div class=mark>航图完成</div><h2>三港同明</h2><p>这一片海域的三座信标已全部点亮。计时仍在继续，请前往下一关。</p><p class=hint>点击下方「下一关」继续。</p></div>'}else if(state==='won'){overlay.hidden=false;overlay.innerHTML='<div class=panel><div class=mark>航程胜利</div><h2>灯火抵达三海</h2><p>三关的港口信标均已点亮，且你在 90 秒内保住了能量。</p><p class=hint>点击「重开航程」再次挑战。</p></div>'}else if(state==='lost'){overlay.hidden=false;overlay.innerHTML='<div class=panel><div class=mark>航程失败</div><h2>光路中断</h2><p>'+ (remaining<=0?'90 秒航行时限已到。':'8 点能量已因误转耗尽。') +'</p><p class=hint>点击「重开航程」重新绘制航线。</p></div>'}else{overlay.hidden=true;overlay.innerHTML=''}}function sync(){const lit=state==='intro'?0:result.lit.size;root.dataset.playfieldState=state+'-run'+run+'-level'+(level+1)+'-ports'+lit+'-energy'+energy+'-turns'+turns;levelText.textContent=String(level+1).padStart(2,'0')+' / 03';timeText.textContent=Math.ceil(remaining)+' 秒';scoreText.textContent=energy+' · '+lit+'/3';feedback.textContent=note;startBtn.disabled=state==='playing'||state==='levelclear';nextBtn.disabled=state!=='levelclear';setOverlay()}function startGame(){run++;level=0;board=makeBoard(0);selected=0;energy=8;turns=0;remaining=90;startedAt=performance.now();state='playing';note='第一片海域：先观察分光后的断路，再旋转铜镜。';result=trace();sync();paint(performance.now());loop()}function nextLevel(){if(state!=='levelclear')return;level++;board=makeBoard(level);selected=0;state='playing';note='已抵达'+levels[level].name+'。礁石会截断光束。';result=trace();sync();paint(performance.now());loop()}function rotate(i){if(state!=='playing')return;selected=i;const m=board.mirrors[i],wasRight=m.dir===m.goal;m.dir=1-m.dir;turns++;if(wasRight)energy--;result=trace();note=wasRight?'逆光误转：能量 −1。重新对准这面镜子。':'航路校正：光束向港口延伸。';if(energy<=0){state='lost';note='能量耗尽：误转了已对准的铜镜。'}else if(result.lit.size===3){if(level===2){state='won';note='三片海域的九座信标全部点亮，航程完成！'}else{state='levelclear';note='本关三港全亮！点击「下一关」继续。'}}sync();paint(performance.now())}function primary(){if(state==='levelclear'){nextLevel();return}if(state!=='playing')startGame();rotate(selected)}function loop(){if(raf||!(state==='playing'||state==='levelclear'))return;raf=requestAnimationFrame(tick)}function tick(now){raf=0;if(!(state==='playing'||state==='levelclear'))return;remaining=Math.max(0,90-(now-startedAt)/1000);if(remaining===0){state='lost';note='时限已到：三片海域尚未全部通航。';sync();paint(now);return}if(now-lastPaint>70){timeText.textContent=Math.ceil(remaining)+' 秒';paint(now);lastPaint=now}loop()}function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function map(){ctx.fillStyle='#092633';ctx.fillRect(0,0,1000,1000);for(let j=0;j<11;j++){ctx.beginPath();for(let x=0;x<=1000;x+=18){const y=75+j*90+Math.sin(x/80+j*.7)*18+Math.sin(x/38+j)*5;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=j%3===0?'#b3c3a52b':'#8bb6ad18';ctx.lineWidth=j%3===0?2:1;ctx.stroke()}ctx.strokeStyle='#c4ab7740';ctx.lineWidth=1;for(let i=0;i<7;i++){line(C(i),105,C(i),895);line(105,C(i),895,C(i))}ctx.strokeStyle='#ba926064';ctx.lineWidth=2;ctx.strokeRect(105,105,790,790);for(let i=0;i<7;i++){ctx.fillStyle='#d3be925e';ctx.font='15px Georgia';ctx.fillText(String(i+1),C(i)-5,121);ctx.fillText('ABCDEFG'[i],87,C(i)+5)}for(let i=0;i<16;i++){const x=116+i*50;ctx.strokeStyle='#bd996859';line(x,908,x,908+(i%4===0?22:9))}ctx.fillStyle='#c49a6b';ctx.font='18px Georgia';ctx.fillText('TIDAL SOUNDINGS   ·   90s',120,963);ctx.fillText(levels[level].name,680,963)}function drawReef(x,y){const a=C(x),b=C(y);ctx.save();ctx.translate(a,b);ctx.rotate((x+y)*.19);ctx.fillStyle='#16333b';ctx.strokeStyle='#bd986e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-32,22);ctx.lineTo(-24,-15);ctx.lineTo(-8,-31);ctx.lineTo(13,-23);ctx.lineTo(31,5);ctx.lineTo(18,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#d9bf904d';line(-23,13,-7,-13);line(-7,-13,14,-7);line(2,16,17,8);ctx.restore()}function drawLight(now){if(state==='intro')return;ctx.save();ctx.lineCap='round';for(const s of result.segments){const a=C(s.x),b=C(s.y),c=C(s.nx),d=C(s.ny);ctx.strokeStyle=s.reef?'#d8725670':'#e7b46b2c';ctx.lineWidth=30;line(a,b,c,d);ctx.strokeStyle=s.reef?'#e88469':'#f6d98a';ctx.lineWidth=5;line(a,b,c,d)}ctx.strokeStyle='#fff3b8';ctx.lineWidth=2;ctx.setLineDash([12,14]);ctx.lineDashOffset=-(now/30)%26;for(const s of result.segments)line(C(s.x),C(s.y),C(s.nx),C(s.ny));ctx.restore()}function drawPrism(){const x=C(2),y=C(3);ctx.save();ctx.translate(x,y);ctx.fillStyle='#d2a16b';ctx.strokeStyle='#f8e7bc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-31);ctx.lineTo(31,0);ctx.lineTo(0,31);ctx.lineTo(-31,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#183847';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(16,0);ctx.lineTo(0,16);ctx.lineTo(-16,0);ctx.closePath();ctx.fill();ctx.fillStyle='#f1d597';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.restore();ctx.fillStyle='#e4c69c';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText('分光',x,y+53)}function drawLighthouse(){const x=C(0),y=C(3);ctx.save();ctx.translate(x,y);ctx.fillStyle='#e8d9bb';ctx.strokeStyle='#ba8b5d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,31);ctx.lineTo(-13,-13);ctx.lineTo(13,-13);ctx.lineTo(20,31);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#c68b57';ctx.fillRect(-22,-21,44,9);ctx.fillStyle='#f8db93';ctx.beginPath();ctx.arc(0,-27,11,0,7);ctx.fill();ctx.strokeStyle='#f5d48d';line(22,-27,38,-27);ctx.restore();ctx.fillStyle='#edd5af';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText('灯塔',x,y+55)}function drawPort(p){const x=C(p.x),y=C(p.y),on=result.lit.has(key(p.x,p.y))&&state!=='intro';ctx.save();ctx.translate(x,y);ctx.strokeStyle=on?'#ffe6a0':'#8d7460';ctx.lineWidth=3;for(let r=27;r<=41;r+=14){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=on?'#f8d68b':'#3a4c4c';ctx.beginPath();ctx.moveTo(-12,21);ctx.lineTo(-10,-12);ctx.lineTo(10,-12);ctx.lineTo(12,21);ctx.closePath();ctx.fill();ctx.fillStyle=on?'#fff2bb':'#a67a58';ctx.beginPath();ctx.arc(0,-18,7,0,7);ctx.fill();ctx.restore();ctx.fillStyle=on?'#fff1c4':'#b8ac96';ctx.font='16px Georgia';ctx.textAlign=p.x>4?'right':'center';ctx.fillText(p.n,p.x>4?x-12:x,y+58)}function drawMirror(m,i){const x=C(m.x),y=C(m.y),active=i===selected&&state==='playing';ctx.save();ctx.translate(x,y);if(active){ctx.strokeStyle='#fff0bd';ctx.lineWidth=3;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(0,0,45,0,7);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#173541';ctx.strokeStyle='#c68f5b';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,31,0,7);ctx.fill();ctx.stroke();ctx.strokeStyle='#e8c48b';ctx.lineWidth=7;ctx.lineCap='round';if(m.dir===0)line(-19,19,19,-19);else line(-19,-19,19,19);ctx.strokeStyle='#fff1cf';ctx.lineWidth=2;if(m.dir===0)line(-19,19,19,-19);else line(-19,-19,19,19);ctx.restore()}function paint(now){ctx.setTransform(1.5,0,0,1.5,0,0);map();for(const r of board.reefs){const p=r.split(',').map(Number);drawReef(p[0],p[1])}drawLight(now);drawPrism();drawLighthouse();board.ports.forEach(drawPort);board.mirrors.forEach(drawMirror);if(state==='intro'){ctx.fillStyle='#06182457';ctx.fillRect(0,0,1000,1000)}}canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),px=(e.clientX-rect.left)*1000/rect.width,py=(e.clientY-rect.top)*1000/rect.height;const i=board.mirrors.findIndex(m=>Math.hypot(px-C(m.x),py-C(m.y))<43);if(i<0)return;if(state==='intro')startGame();if(state==='playing')rotate(i)});startBtn.addEventListener('click',startGame);primaryBtn.addEventListener('click',primary);nextBtn.addEventListener('click',nextLevel);restartBtn.addEventListener('click',startGame);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();primary()}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){if(state!=='playing')return;e.preventDefault();selected=(selected+(e.key==='ArrowRight'?1:-1)+board.mirrors.length)%board.mirrors.length;note='已选中第 '+(selected+1)+' 面铜镜。';sync();paint(performance.now())}});result=trace();sync();paint(0)})();</script></body></html>

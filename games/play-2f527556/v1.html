<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>月林拾光·夜行版</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#081b1a;color:#f5f1d9;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(circle at 50% 8%,#24483e,#081b1a 72%)}.game{width:min(1100px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}h1{font-size:clamp(21px,3vw,32px);letter-spacing:3px;margin:0;color:#ffdc8a;text-shadow:0 0 20px #e6ad5b77}.sub{font-size:12px;color:#a8c9b6;margin-top:3px}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{background:#143a32;border:1px solid #4c8068;border-radius:12px;padding:7px 10px;min-width:72px;text-align:center;font-size:13px;box-shadow:inset 0 1px #ffffff17}.stat b{color:#ffe3a2;font-size:17px}.stat.difficulty b{font-size:13px}.stage{position:relative;overflow:hidden;border:3px solid #64846c;border-radius:22px;box-shadow:0 20px 50px #0008,0 0 0 5px #122d29;background:#183c32}canvas{display:block;width:100%;height:clamp(360px,66vh,650px);touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#071a18bd;backdrop-filter:blur(5px);z-index:3}.overlay.hidden{display:none}.card{width:min(460px,100%);padding:26px 24px;text-align:center;border:1px solid #a9c99399;border-radius:22px;background:linear-gradient(145deg,#214a3f,#102e2b);box-shadow:0 20px 60px #0009}.moon{font-size:44px;color:#ffe6a1;text-shadow:0 0 24px #ffe6a1}.card h2{margin:8px 0 10px;font-size:27px;color:#ffe5ab}.card p{font-size:15px;line-height:1.75;color:#d4e7d9;margin:0 0 18px}.card button,.pulse,.restart{border:0;border-radius:14px;background:linear-gradient(#ffe7a7,#f1b966);color:#293829;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #a46d33,0 10px 22px #0006}.card button{font-size:17px;padding:12px 34px}.card button:active,.pulse:active,.restart:active{transform:translateY(4px);box-shadow:0 1px 0 #a46d33}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 3px 0}.hint{font-size:13px;color:#b6d0bf;line-height:1.6}.touch{display:flex;align-items:center;gap:12px}.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}.dir{border:1px solid #709784;border-radius:12px;background:#1d4b3f;color:#f7e7b8;font-size:22px;font-weight:700;touch-action:none;user-select:none}.dir.active{background:#4d8770;transform:scale(.94)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.pulse{min-width:126px;height:56px;padding:7px 10px;font-size:14px;touch-action:none}.restart{height:44px;padding:6px 12px;font-size:12px;background:linear-gradient(#cde3cb,#91b6a0);box-shadow:0 4px 0 #50715d,0 8px 16px #0005}@media(max-width:700px){body{padding:8px;align-items:flex-start}header{align-items:flex-start;flex-wrap:wrap;gap:7px}h1{font-size:21px;letter-spacing:2px}.sub{font-size:10px}.stats{width:100%;justify-content:space-between;gap:4px}.stat{min-width:0;flex:1;padding:5px 3px;font-size:10px}.stat b{font-size:14px}.stat.difficulty b{font-size:10px}canvas{height:clamp(350px,59dvh,650px)}.controls{align-items:flex-end;gap:5px}.hint{font-size:10px;max-width:90px}.touch{gap:7px}.dpad{grid-template-columns:repeat(3,39px);grid-template-rows:repeat(2,39px);gap:3px}.pulse{min-width:84px;font-size:11px;height:48px;padding:4px}.restart{height:38px;padding:4px 7px;font-size:10px}.card{padding:20px 17px}.card h2{font-size:24px}.card p{font-size:13px}}</style></head><body><main class='game'><header><div><h1>✦ 月林拾光</h1><div class='sub'>循着微光，穿过渐深的夜色</div></div><div class='stats'><div class='stat'>得分 <b id='count'>0/10</b></div><div class='stat'>生命 <b id='lives'>♥♥♥</b></div><div class='stat'>时间 <b id='time'>180</b></div><div class='stat difficulty'>难度 <b id='difficulty'>薄暮·简单</b></div></div></header><div class='stage'><canvas id='field' aria-label='俯视角森林游戏画面'></canvas><div class='overlay' id='overlay'><div class='card'><div class='moon'>☾</div><h2 id='overlayTitle'>月林拾光</h2><p id='overlayText'>收集 10 个发光蘑菇，再回到左下角营地。每拾取一个蘑菇，夜色都会加深；剩余蘑菇和你身边会持续发光。难度会从薄暮逐步升至极夜，狐狸也会稍微加快。被狐狸碰到会失去一颗心。按空格或点击按钮释放萤光脉冲，暂时定住附近狐狸。你有 180 秒和 3 颗心。</p><button id='start'>开始探险</button></div></div></div><div class='controls'><div class='hint'>方向键 / WASD 移动<br>空格释放萤光脉冲<br>集齐后返回营地</div><div class='touch'><div class='dpad'><button class='dir up' data-dir='up' aria-label='向上'>↑</button><button class='dir left' data-dir='left' aria-label='向左'>←</button><button class='dir down' data-dir='down' aria-label='向下'>↓</button><button class='dir right' data-dir='right' aria-label='向右'>→</button></div><button class='pulse' id='pulse'>✦ 萤光脉冲</button><button class='restart' id='restart'>重新开始</button></div></div></main><script>(()=>{'use strict';const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),start=document.getElementById('start'),countEl=document.getElementById('count'),livesEl=document.getElementById('lives'),timeEl=document.getElementById('time'),difficultyEl=document.getElementById('difficulty'),pulseBtn=document.getElementById('pulse'),restartBtn=document.getElementById('restart');const W=1100,H=760,camp={x:100,y:650},spots=[[105,470],[260,670],[380,455],[520,690],[610,245],[750,690],[935,690],[1020,230],[770,455],[460,70]],trees=[[220,160,40],[330,100,35],[470,190,45],[630,125,45],[820,160,45],[980,130,40],[160,330,43],[350,340,45],[570,360,50],[780,330,45],[1000,345,50],[260,540,42],[450,600,45],[660,545,43],[870,590,50],[990,500,37]],routes=[[[290,450],[520,450],[730,450],[910,450]],[[610,250],[760,250],[950,245],[915,420]],[[220,625],[410,680],[630,650],[800,660]]];let seed=7219;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);const leaves=Array.from({length:220},()=>({x:rand()*W,y:rand()*H,r:2+rand()*4,c:rand()>.5?'#6c9764':'#91aa71'}));const night=document.createElement('canvas');night.width=550;night.height=380;const nctx=night.getContext('2d');let viewW=1100,viewH=680,camX=0,camY=0,mode='idle',player,foxes,mushrooms,lives=3,time=180,found=0,cooldown=0,flash=0,last=0;const keys=new Set(),touchDirs=new Map();function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));viewW=Math.min(r.width<700?500:1100,H*r.width/Math.max(1,r.height));viewH=viewW*r.height/Math.max(1,r.width)}window.addEventListener('resize',resize);resize();function tier(){return found<3?'薄暮·简单':found<6?'入夜·普通':found<9?'深夜·困难':'极夜·严峻'}function updateHud(){countEl.textContent=found+'/10';livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);timeEl.textContent=Math.max(0,Math.ceil(time));difficultyEl.textContent=tier();pulseBtn.textContent=cooldown>0?'脉冲 '+Math.ceil(cooldown)+' 秒':'✦ 萤光脉冲';pulseBtn.style.opacity=cooldown>0?'.63':'1'}function setup(){player={x:camp.x,y:camp.y,inv:0};foxes=routes.map((route,i)=>({x:route[0][0],y:route[0][1],route,index:1,stun:0,phase:i*2}));mushrooms=spots.map(([x,y])=>({x,y,taken:false}));lives=3;time=180;found=0;cooldown=0;flash=0;last=0;keys.clear();touchDirs.clear();document.querySelectorAll('.dir').forEach(b=>b.classList.remove('active'));mode='playing';overlay.classList.add('hidden');updateHud()}function end(win){mode=win?'won':'lost';overlayTitle.textContent=win?'满载而归！':'森林暂别';overlayText.textContent=win?'你带着 10 个发光蘑菇回到了营地。剩余 '+Math.ceil(time)+' 秒。':found+' / 10 个蘑菇已收集。记住发光路线，再试一次吧。';start.textContent='重新探险';overlay.classList.remove('hidden')}start.addEventListener('click',setup);restartBtn.addEventListener('click',setup);function pulse(){if(mode!=='playing'||cooldown>0)return;cooldown=8;flash=.5;let hit=0;for(const f of foxes)if(Math.hypot(f.x-player.x,f.y-player.y)<205){f.stun=2.1;hit++}if(hit)cooldown=Math.max(4.5,cooldown-hit*.8);updateHud()}pulseBtn.addEventListener('click',pulse);const movement=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D',' '];window.addEventListener('keydown',e=>{if(movement.includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '&&!e.repeat)pulse();if(e.key==='Enter'&&mode!=='playing')setup()});window.addEventListener('keyup',e=>keys.delete(e.key));function clearInput(){keys.clear();touchDirs.clear();document.querySelectorAll('.dir').forEach(b=>b.classList.remove('active'))}window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();last=0}});document.querySelectorAll('.dir').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touchDirs.set(e.pointerId,b.dataset.dir);b.classList.add('active')});const stop=e=>{touchDirs.delete(e.pointerId);b.classList.remove('active')};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)});function blocked(x,y){if(x<17||y<17||x>W-17||y>H-17)return true;for(const t of trees)if(Math.hypot(x-t[0],y-t[1])<t[2]+9)return true;return false}function step(dt){time-=dt;if(time<=0){time=0;end(false);updateHud();return}cooldown=Math.max(0,cooldown-dt);flash=Math.max(0,flash-dt);player.inv=Math.max(0,player.inv-dt);let dx=0,dy=0;const held=d=>[...touchDirs.values()].includes(d);if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||held('left'))dx--;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D')||held('right'))dx++;if(keys.has('ArrowUp')||keys.has('w')||keys.has('W')||held('up'))dy--;if(keys.has('ArrowDown')||keys.has('s')||keys.has('S')||held('down'))dy++;const len=Math.hypot(dx,dy)||1,spd=205;dx=dx/len*spd*dt;dy=dy/len*spd*dt;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;for(const m of mushrooms)if(!m.taken&&Math.hypot(player.x-m.x,player.y-m.y)<27){m.taken=true;found++;cooldown=Math.max(0,cooldown-1.5);flash=.22}for(const f of foxes){f.phase+=dt;if(f.stun>0){f.stun=Math.max(0,f.stun-dt);continue}const dist=Math.hypot(player.x-f.x,player.y-f.y),chase=dist<155&&player.inv<=0;let tx,ty;if(chase){tx=player.x;ty=player.y}else{[tx,ty]=f.route[f.index];if(Math.hypot(tx-f.x,ty-f.y)<12){f.index=(f.index+1)%f.route.length;[tx,ty]=f.route[f.index]}}const d=Math.hypot(tx-f.x,ty-f.y)||1,move=Math.min(d,(chase?128:85)*(1+found*.022)*dt);f.x+=(tx-f.x)/d*move;f.y+=(ty-f.y)/d*move;if(player.inv<=0&&Math.hypot(player.x-f.x,player.y-f.y)<28){lives--;player.inv=2.5;flash=.5;f.stun=.7;if(lives<=0){end(false);break}}}if(mode==='playing'&&found===10&&Math.hypot(player.x-camp.x,player.y-camp.y)<48)end(true);updateHud()}function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function light(x,y,r){const g=nctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,.98)');g.addColorStop(.45,'rgba(0,0,0,.68)');g.addColorStop(1,'rgba(0,0,0,0)');nctx.fillStyle=g;nctx.beginPath();nctx.arc(x,y,r,0,Math.PI*2);nctx.fill()}function drawNight(){nctx.setTransform(1,0,0,1,0,0);nctx.clearRect(0,0,550,380);nctx.fillStyle='rgba(3,8,24,'+(0.10+found*.062)+')';nctx.fillRect(0,0,550,380);nctx.setTransform(.5,0,0,.5,0,0);nctx.globalCompositeOperation='destination-out';light(camp.x,camp.y,105);for(const m of mushrooms)if(!m.taken)light(m.x,m.y,72);light(player.x,player.y,125);nctx.globalCompositeOperation='source-over';nctx.setTransform(1,0,0,1,0,0);ctx.drawImage(night,0,0,W,H)}function draw(t){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#102d29';ctx.fillRect(0,0,canvas.width,canvas.height);camX=Math.max(0,Math.min(W-viewW,player.x-viewW/2));camY=Math.max(0,Math.min(H-viewH,player.y-viewH/2));const sx=canvas.width/viewW,sy=canvas.height/viewH;ctx.setTransform(sx,0,0,sy,-camX*sx,-camY*sy);ctx.fillStyle='#173c33';ctx.fillRect(0,0,W,H);ctx.fillStyle='#285543';ctx.beginPath();ctx.moveTo(40,655);ctx.bezierCurveTo(290,590,320,695,550,620);ctx.bezierCurveTo(750,555,840,690,1090,640);ctx.lineTo(1090,715);ctx.bezierCurveTo(820,750,670,635,520,700);ctx.bezierCurveTo(280,750,270,650,40,720);ctx.fill();for(const l of leaves){circle(l.x,l.y,l.r,l.c);circle(l.x+4,l.y+3,1.1,'#c3bf8066')}for(const tr of trees){const [x,y,r]=tr;circle(x+5,y+9,r+5,'#071e1a99');circle(x,y,r,'#0d3029');circle(x-7,y-6,r*.76,'#24523e');circle(x+12,y+5,r*.55,'#326448');circle(x-10,y-14,r*.25,'#4a8056');circle(x+r*.4,y-r*.25,3,'#70976d')}drawNight();const campGlow=ctx.createRadialGradient(camp.x,camp.y,2,camp.x,camp.y,65);campGlow.addColorStop(0,'#ffd99188');campGlow.addColorStop(1,'#ffd99100');circle(camp.x,camp.y,65,campGlow);circle(camp.x,camp.y,41,'#754c2c');circle(camp.x,camp.y,35,found===10?'#e7b761':'#9a7843');circle(camp.x,camp.y,29,'#173c33');ctx.fillStyle='#ffe6a0';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(found===10?'返回营地':'营地',camp.x,camp.y-51);for(const m of mushrooms){if(m.taken)continue;const a=.75+.25*Math.sin(t*3+m.x),g=ctx.createRadialGradient(m.x,m.y,1,m.x,m.y,42);g.addColorStop(0,'rgba(255,235,164,'+(.6*a)+')');g.addColorStop(1,'rgba(255,235,164,0)');circle(m.x,m.y,42,g);circle(m.x,m.y+12,4,'#e8d3a3');line(m.x,m.y+8,m.x,m.y-1,'#f2ddb0',5);ctx.beginPath();ctx.ellipse(m.x,m.y-3,12,8,0,Math.PI,Math.PI*2);ctx.fillStyle='#e7a65b';ctx.fill();circle(m.x-5,m.y-5,2,'#fff0bd');circle(m.x+4,m.y-7,1.7,'#fff0bd')}for(const f of foxes){ctx.save();ctx.translate(f.x,f.y);const q=f.stun>0;circle(0,8,17,'#061c1a77');ctx.fillStyle=q?'#b7d7bc':'#d87543';ctx.beginPath();ctx.moveTo(-15,-2);ctx.lineTo(-27,8);ctx.lineTo(-12,11);ctx.lineTo(0,5);ctx.fill();circle(0,0,14,q?'#a7c7b5':'#dc8350');ctx.beginPath();ctx.moveTo(-12,-8);ctx.lineTo(-11,-21);ctx.lineTo(-2,-12);ctx.moveTo(12,-8);ctx.lineTo(11,-21);ctx.lineTo(2,-12);ctx.fillStyle=q?'#91b6aa':'#ca6740';ctx.fill();circle(-5,0,2,'#232728');circle(5,0,2,'#232728');circle(0,7,3,'#f7e7c5');if(q){ctx.fillStyle='#e4f5d3';ctx.font='17px system-ui';ctx.fillText('✦',0,-26)}ctx.restore()}ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(t*9)%2===0)ctx.globalAlpha=.43;circle(2,12,16,'#061c1a77');circle(0,0,15,'#476d74');circle(0,-5,12,'#d8ae78');ctx.beginPath();ctx.arc(0,-7,12,Math.PI,0);ctx.lineTo(12,-5);ctx.lineTo(-12,-5);ctx.fillStyle='#315b66';ctx.fill();circle(-4,-4,1.6,'#26382f');circle(4,-4,1.6,'#26382f');circle(10,10,6,'#b58750');circle(10,10,2,'#f0db99');ctx.restore();if(flash>0){const r=205*(1-flash/.5);ctx.beginPath();ctx.arc(player.x,player.y,Math.max(12,r),0,Math.PI*2);ctx.strokeStyle='rgba(255,226,155,'+Math.min(1,flash*1.6)+')';ctx.lineWidth=5;ctx.stroke()}ctx.setTransform(1,0,0,1,0,0)}function frame(ms){const t=ms/1000,dt=Math.min(.035,last?(ms-last)/1000:0);last=ms;if(mode==='playing')step(dt);draw(t);requestAnimationFrame(frame)}setup();mode='idle';overlay.classList.remove('hidden');requestAnimationFrame(frame)})();</script></body></html>
